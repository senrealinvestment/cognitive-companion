[project]
name = "cognitive-companion-next"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "pydantic>=2,<3", "typesafe-sdk==0.6.0", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_companion"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: explicitly opted-in hosted smoke"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
